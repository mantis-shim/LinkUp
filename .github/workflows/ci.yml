name: CI

on:
  push:
    branches: [ feature/login ]
  pull_request:
    branches: [ feature/login ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run type checking
      run: npm run check

    - name: Run tests
      run: npm run test:run

    - name: Build
      run: npm run build
